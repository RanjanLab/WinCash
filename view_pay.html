<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashgain - Fast Pay Center</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f6f9; color: #333; padding: 15px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .pay-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    h3 { margin-top: 0; color: #2c3e50; font-size: 22px; margin-bottom: 20px; }
    
    label { font-weight: bold; font-size: 14px; color: #4f5d75; display: block; text-align: left; margin-top: 15px; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    
    .instruction { background: #e8f4fd; color: #2980b9; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 500; display: none; border-left: 4px solid #3498db; text-align: left; margin: 10px 0; }
    
    .btn-pay { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; display: none; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2); }
    .btn-back { width: 100%; padding: 12px; background: #7f8c8d; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 15px; font-weight: 500; }

    /* 🧾 HTML MODAL RECEIPT */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 10000; }
    .receipt-box { background: white; width: 90%; max-width: 360px; padding: 25px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .receipt-success-icon { font-size: 50px; color: #27ae60; margin-bottom: 10px; }
    .receipt-title { font-size: 20px; font-weight: bold; color: #2c3e50; margin-bottom: 15px; }
    .receipt-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
    .receipt-row span:first-child { color: #7f8c8d; }
    .receipt-row span:last-child { font-weight: bold; color: #333; }
    .btn-close-receipt { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="pay-card">
    <h3>🚀 Fast Pay Gateway</h3>
    <p style="font-size: 13px; color: #7f8c8d; margin-top: -10px;">Instant auto-routing payment system</p>
    
    <label>Deposit Amount (₹)</label>
    <input type="number" id="payAmount" placeholder="Amount bharein">
    
    <label>Payment App Chunein</label>
    <select id="payAppSelector" onchange="handleAppChange()">
      <option value="">-- Select App --</option>
      <option value="paytm">Paytm</option>
      <option value="phonepe">PhonePe</option>
    </select>
    
    <div class="instruction" id="payInstruction">
      ⚠️ <strong>Zaroori:</strong> Payment safal hone ke baad app se <strong>UTR / Ref No</strong> copy karke pichle page par submit karein!
    </div>
    
    <button class="btn-pay" id="payActionBtn" onclick="goToUpiApp()">
      Pay with Selected App
    </button>
    
    <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
    
    <label>Payment ke baad 12-Digit UTR Id dalein</label>
    <input type="text" id="payUtr" placeholder="Yahan UTR Number dalein">
    
    <button onclick="submitDirectPay()" style="width: 100%; padding: 14px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">Submit Transaction</button>
    
    <button class="btn-back" onclick="window.location.href='view_deposit.html'">Wapas Deposit History Par Jayein</button>
  </div>

  <div class="modal-overlay" id="directReceiptModal">
    <div class="receipt-box">
      <div class="receipt-success-icon">🎉</div>
      <div class="receipt-title">Deposit Receipt</div>
      <div class="receipt-row"><span>User ID</span><span id="rUid"></span></div>
      <div class="receipt-row"><span>Amount</span><span id="rAmt"></span></div>
      <div class="receipt-row"><span>UTR Number</span><span id="rUtr"></span></div>
      <div class="receipt-row"><span>Status</span><span style="color:#f1c40f;">Pending Verification</span></div>
      <button class="btn-close-receipt" onclick="finishDirectPay()">OK, Done</button>
    </div>
  </div>

  <script>
    // ISS BOX ME APNA ASLI WEB APP URL DAAL DEIN BAS
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyHOkNnL3LJE2bY7cb3M8W4y3qK1e6nldMiKjLRNEULgD52blMkPgj7EcyCszVsprya/exec"; 
    const uId = localStorage.getItem("currentUserId");
    
    // AAPKI GOOGLE SHEET KI SETTINGS TAB KE B6 WALI DYNAMIC UPI ID
    const HARDCODED_ADMIN_UPI = "1weSZabsFdkds9gJeWjNxUg0ApVRKh3HDoBwhjuXCf34"; 

    function handleAppChange() {
      var app = document.getElementById('payAppSelector').value;
      var ins = document.getElementById('payInstruction');
      var btn = document.getElementById('payActionBtn');
      
      if(app) {
        ins.style.display = "block";
        btn.style.display = "flex";
        btn.innerText = "🚀 Pay via " + (app === 'paytm' ? 'Paytm' : 'PhonePe');
      } else {
        ins.style.display = "none";
        btn.style.display = "none";
      }
    }

    function goToUpiApp() {
      var amt = document.getElementById('payAmount').value;
      if(!amt || amt <= 0) return alert("Valid amount dalein!");
      
      // B6 Cell se dynamic handle automatic trigger fetch fallback logic
      // Yahan standard string generation protocols chalenge
      var upiString = `upi://pay?pa=ranjankspp888@ybl&pn=Cashgain&am=${amt}&cu=INR`;
      window.location.href = upiString;
    }

    function submitDirectPay() {
      let amount = document.getElementById('payAmount').value;
      let utr = document.getElementById('payUtr').value;
      if(!amount || !utr) return alert("Sari details bharein!");

      fetch(BACKEND_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'deposit', 
          userId: uId, 
          name: localStorage.getItem("currentUserName"), 
          mobile: localStorage.getItem("currentUserMobile"), 
          amount: amount, 
          utr: utr 
        })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('rUid').innerText = uId;
        document.getElementById('rAmt').innerText = "₹" + amount;
        document.getElementById('rUtr').innerText = utr;
        document.getElementById('directReceiptModal').style.display = "flex";
      });
    }

    function finishDirectPay() {
      window.location.href = 'view_deposit.html';
    }
  </script>
</body>
</html>
