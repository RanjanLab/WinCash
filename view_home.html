<!DOCTYPE html>
<html lang="hi">
<head>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-left: 5px solid #3498db; }
    .card.bal { border-left-color: #27ae60; background: #eafaf1; }
    .card.dep { border-left-color: #f1c40f; }
    .card.earn { border-left-color: #9b59b6; }
    .card.deb { border-left-color: #e74c3c; }
    h3 { margin: 0; font-size: 14px; color: #7f8c8d; text-transform: uppercase; }
    p { margin: 10px 0 0 0; font-size: 28px; font-weight: bold; }
    .loader { font-size: 16px; color: #3498db; }
  </style>
</head>
<body>

  <h2>Main Dashboard</h2>
  <div id="loading" class="loader">Wallet Loding Please Wait...</div>

  <div class="grid" id="dashboardGrid" style="display: none;">
    <div class="card bal">
      <h3>Available Balance</h3>
      <p>₹<span id="valBal">0</span></p>
    </div>
    <div class="card dep">
      <h3>Total Approved Deposit</h3>
      <p>₹<span id="valDep">0</span></p>
    </div>
    <div class="card earn">
      <h3>Total Earnings</h3>
      <p>₹<span id="valEarn">0</span></p>
    </div>
    <div class="card deb">
      <h3>Total Withdrawal</h3>
      <p>₹<span id="valDeb">0</span></p>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyHOkNnL3LJE2bY7cb3M8W4y3qK1e6nldMiKjLRNEULgD52blMkPgj7EcyCszVsprya/exec";
    const userId = localStorage.getItem("currentUserId");

    fetch(API_URL + `?action=getDashboard&userId=${userId}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        if(data.status === "success") {
          document.getElementById('valBal').innerText = data.data.availableBalance;
          document.getElementById('valDep').innerText = data.data.deposit;
          document.getElementById('valEarn').innerText = data.data.earning;
          document.getElementById('valDeb').innerText = data.data.debit;
          document.getElementById('dashboardGrid').style.display = 'grid';
        }
      });
  </script>
</body>
</html>
