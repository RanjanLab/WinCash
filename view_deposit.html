<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cashgain - Deposit Center</title>
  <style>
    :root { 
      --primary: #1e293b; 
      --accent: #2c3e50;
      --success: #16a34a; 
      --pending: #ea580c;
      --bg: #f8fafc; 
      --text: #334155; 
    }
    
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding: 15px; padding-bottom: 50px; box-sizing: border-box; }
    .deposit-card { background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); margin: 0 auto 25px auto; max-width: 450px; width: 100%; box-sizing: border-box; }
    h2 { color: var(--primary); margin-top: 0; font-weight: 700; font-size: 22px; text-align: center; }
    
    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--primary); display: block; margin-bottom: 6px; }
    .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #f8fafc; }
    .input-group input:focus, .input-group select:focus { border-color: var(--primary); outline: none; background: white; }
    
    .btn-action { width: 100%; padding: 14px 10px; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: #2b394a; box-shadow: 0 4px 12px rgba(43,57,74,0.2); transition: background 0.2s; margin-top: 10px; }
    .btn-action:hover { background: #1a232e; }
    
    .table-container { overflow-x: auto; max-width: 450px; margin: 0 auto; margin-bottom: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); background: white; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; background: white; min-width: 100%; }
    th, td { border-bottom: 1px solid #f1f5f9; padding: 12px 10px; text-align: left; font-size: 13px; }
    th { background: var(--primary); color: white; font-weight: 600; }
    
    .status-badge { font-weight: bold; padding: 4px 8px; border-radius: 6px; display: inline-block; font-size: 11px; }
    .status-pending { color: var(--pending); background: #fff7ed; }
    .status-approved { color: var(--success); background: #f0fdf4; }
    .status-failed { color: #ef4444; background: #fef2f2; }
  </style>
</head>
<body>

  <div class="deposit-card">
    <h2>💳 New Deposit Request</h2>
    
    <div class="input-group">
      <label>1. Enter Amount (₹)</label>
      <input type="number" id="depositAmount" placeholder="Enter amount to add" min="1">
    </div>

    <div class="input-group">
      <label>2. Select Payment App</label>
      <select id="paymentApp">
        <option value="">-- Choose App --</option>
        <option value="PhonePe">PhonePe</option>
        <option value="GooglePay">Google Pay</option>
        <option value="Paytm">Paytm</option>
        <option value="Other">Other UPI App</option>
      </select>
    </div>
    
    <div class="input-group">
      <label>3. Paste UTR Reference ID after Payment</label>
      <input type="text" id="utrNumber" placeholder="Enter 12-digit UTR / Ref Number" maxlength="12">
    </div>
    
    <button class="btn-action" id="btnSubmit" onclick="submitDepositRequest()">Submit Transaction</button>
  </div>

  <h4 style="color: var(--primary); max-width:450px; margin:0 auto 15px auto; font-weight:700; font-size:15px;">📜 Your Deposit History Report</h4>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Amount</th>
          <th>UTR / Ref No</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="depositTableBody">
        <tr><td colspan="4" style="text-align:center; color:#64748b;">Syncing payment server logs...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // 🎯 LINKED DIRECTLY WITH YOUR RE-DEPLOYED SERVER URL KEY
    const API_URL = "https://script.google.com/macros/s/AKfycbyUhDKJQ05Qr6o3T0ab_W_Ucw0JDYMpRLrNL3lcC2j9YrHUCGGkCObcsVza72EgfEv4/exec";
    const loginUserId = (localStorage.getItem("currentUserId") || "").trim().toLowerCase();
    const loginUserName = localStorage.getItem("currentUserName") || "User";
    const loginUserMobile = localStorage.getItem("currentUserMobile") || "";

    function loadDepositHistory() {
      if(!loginUserId) {
        document.getElementById('depositTableBody').innerHTML = "<tr><td colspan='4' style='text-align:center; color:#ef4444;'>Session Expired. Please Re-login.</td></tr>";
        return;
      }
      
      fetch(API_URL + `?action=getDepositHistory&userId=${loginUserId}`)
        .then(res => res.json())
        .then(res => {
          if(res.status === "success") {
            let html = "";
            if(res.data && res.data.length > 0) {
              res.data.forEach(row => {
                let statusClass = "status-pending";
                let currentStatus = (row.status || "").trim().toLowerCase();
                
                if(currentStatus === "approved") {
                  statusClass = "status-approved";
                } else if(currentStatus === "failed" || currentStatus === "rejected") {
                  statusClass = "status-failed";
                }
                
                html += `<tr>
                  <td>${row.date}</td>
                  <td><strong>₹${row.amount}</strong></td>
                  <td style="font-family: monospace;">${row.utr}</td>
                  <td><span class="status-badge ${statusClass}">${row.status || 'Pending'}</span></td>
                </tr>`;
              });
            }
            document.getElementById('depositTableBody').innerHTML = html || "<tr><td colspan='4' style='text-align:center; color:#64748b;'>No deposit transactions found.</td></tr>";
          }
        })
        .catch(err => {
          document.getElementById('depositTableBody').innerHTML = "<tr><td colspan='4' style='text-align:center; color:#64748b;'>No transaction history records.</td></tr>";
        });
    }

    // Fix update to trigger Code.gs doPost dynamic router engine
    function submitDepositRequest() {
      const amountInput = document.getElementById('depositAmount');
      const utrInput = document.getElementById('utrNumber');
      const appSelect = document.getElementById('paymentApp');
      
      const amount = amountInput.value.trim();
      const utr = utrInput.value.trim();
      const btn = document.getElementById('btnSubmit');
      
      if(!amount || Number(amount) <= 0) { alert("Please enter a valid amount!"); return; }
      if(!appSelect.value) { alert("Please select your payment app!"); return; }
      if(utr.length < 10) { alert("Please enter a valid UTR Reference Number!"); return; }
      
      btn.innerText = "Verifying Ledger Token...";
      btn.disabled = true;
      
      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "deposit",
          userId: loginUserId,
          name: loginUserName,
          mobile: loginUserMobile,
          amount: Number(amount),
          utr: utr
        })
      })
      .then(() => {
        alert("Deposit request submitted successfully! Pending approval.");
        amountInput.value = "";
        utrInput.value = "";
        appSelect.value = "";
        btn.innerText = "Submit Transaction";
        btn.disabled = false;
        setTimeout(loadDepositHistory, 1500);
      })
      .catch(err => {
        alert("Request processed.");
        btn.innerText = "Submit Transaction";
        btn.disabled = false;
        setTimeout(loadDepositHistory, 1500);
      });
    }

    window.onload = loadDepositHistory;
  </script>
</body>
</html>
