<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashgain - Daily Earning Statement</title>
  <style>
    /* Modern Professional Layout */
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f6f9; color: #333; padding: 15px; padding-bottom: 50px; box-sizing: border-box; }
    h2 { color: #2c3e50; text-align: center; margin-top: 10px; margin-bottom: 5px; font-weight: 700; }
    .subtitle { color: #7f8c8d; text-align: center; font-size: 14px; margin-bottom: 25px; line-height: 1.4; padding: 0 10px; }
    
    /* Premium Mobile Fit Table Engine - Modifed for No-Scroll */
    .table-container { max-width: 600px; margin: 0 auto; margin-bottom: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); background: white; }
    table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; } /* fixed layout lagaya taaki screen se bahar na jaye */
    th, td { border: 1px solid #eee; padding: 12px 8px; text-align: left; font-size: 13px; word-wrap: break-word; white-space: normal; } /* Padding aur font thoda kam kiya aur wrap active kiya */
    
    /* Width allocation for columns to fit beautifully */
    th:nth-child(1), td:nth-child(1) { width: 30%; } /* Date Column */
    th:nth-child(2), td:nth-child(2) { width: 30%; } /* Profit Amount Column */
    th:nth-child(3), td:nth-child(3) { width: 40%; } /* Remark Column */
    
    th { background: #2c3e50; color: white; font-weight: 600; position: sticky; top: 0; }
    
    /* Status Styles */
    .profit-text { color: #27ae60; font-weight: bold; background: #eafaf1; padding: 4px 6px; border-radius: 6px; display: inline-block; }
    .remark-text { color: #4f5d75; font-size: 12px; }
  </style>
</head>
<body>

  <h2>📈 Daily Earning Statement</h2>
  <div class="subtitle">Automatic interest earned every night on your total deposit will be displayed here.</div>

  <!-- Responsive Table Wrapper -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Profit Amount</th>
          <th>Remark</th>
        </tr>
      </thead>
      <tbody id="earnTableBody">
        <tr><td colspan="3" style="text-align:center; color:#7f8c8d;">Loading statement...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyHOkNnL3LJE2bY7cb3M8W4y3qK1e6nldMiKjLRNEULgD52blMkPgj7EcyCszVsprya/exec";
    const userId = localStorage.getItem("currentUserId");

    fetch(API_URL + `?action=getEarningHistory&userId=${userId}`)
      .then(res => res.json())
      .then(data => {
        let html = "";
        if(data.status === "success") {
          data.history.forEach(row => {
            html += `<tr>
              <td>${row.date}</td>
              <td><span class="profit-text">+₹${row.amount}</span></td>
              <td class="remark-text">${row.remark}</td>
            </tr>`;
          });
          document.getElementById('earnTableBody').innerHTML = html || "<tr><td colspan='3' style='text-align:center; color:#7f8c8d;'>No earnings credited yet.</td></tr>";
        }
      })
      .catch(err => {
        document.getElementById('earnTableBody').innerHTML = "<tr><td colspan='3' style='text-align:center; color:#e74c3c;'>Failed to sync statement.</td></tr>";
      });
  </script>
</body>
</html>
