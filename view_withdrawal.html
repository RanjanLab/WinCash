<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cashgain - Withdrawal Center</title>
  <style>
    :root { 
      --primary: #1e293b; 
      --accent: #c2410c;
      --success: #16a34a; 
      --pending: #ea580c;
      --bg: #f8fafc; 
      --text: #334155; 
    }
    
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding: 15px; padding-bottom: 50px; box-sizing: border-box; }
    .withdraw-card { background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); margin-bottom: 25px; max-width: 450px; width: 100%; margin: 0 auto 25px auto; box-sizing: border-box; text-align: center; }
    h2 { color: var(--primary); margin-top: 0; font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .subtitle { color: #64748b; font-size: 13px; margin-bottom: 20px; line-height: 1.4; }
    
    .input-group { text-align: left; margin-bottom: 15px; max-width: 100%; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--primary); display: block; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; transition: border 0.2s; background: #f8fafc; }
    .input-group input:focus { border-color: var(--accent); outline: none; background: white; }
    
    .btn-action { width: 100%; padding: 14px 10px; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: var(--accent); box-shadow: 0 4px 12px rgba(194,65,12,0.2); transition: background 0.2s; margin-top: 10px; }
    .btn-action:hover { background: #9a3412; }
    
    .table-container { max-width: 450px; margin: 0 auto; margin-bottom: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); background: white; }
    table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
    th, td { border-bottom: 1px solid #f1f5f9; padding: 12px 8px; text-align: left; font-size: 13px; word-wrap: break-word; white-space: normal; }
    
    th:nth-child(1), td:nth-child(1) { width: 40%; }
    th:nth-child(2), td:nth-child(2) { width: 30%; }
    th:nth-child(3), td:nth-child(3) { width: 30%; }
    
    th { background: var(--primary); color: white; font-weight: 600; }
    
    .status-badge { font-weight: bold; padding: 4px 6px; border-radius: 6px; display: inline-block; font-size: 11px; text-align: center; width: 100%; box-sizing: border-box; }
    .status-pending { color: var(--pending); background: #fff7ed; }
    .status-approved { color: var(--success); background: #f0fdf4; }
    .status-failed { color: #ef4444; background: #fef2f2; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); display: none; justify-content: center; align-items: center; z-index: 20000; backdrop-filter: blur(4px); }
    .alert-box { background: white; width: 88%; max-width: 380px; padding: 30px 24px; border-radius: 16px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); box-sizing: border-box; animation: popup 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    
    @keyframes popup {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .alert-icon { font-size: 50px; margin-bottom: 15px; display: block; }
    .alert-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .alert-msg { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 22px; }
    .btn-alert-close { width: 100%; padding: 13px; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

  <div class="withdraw-card">
    <h2>💸 Withdrawal Center</h2>
    <div class="subtitle">Submit a request to securely process funds directly from your account balance.</div>
    
    <div class="input-group">
      <label>Enter Amount (₹)</label>
      <input type="number" id="withdrawAmount" placeholder="Enter amount to withdraw" min="1">
    </div>
    
    <button class="btn-action" id="btnSubmit" onclick="submitWithdrawRequest()">Withdraw Fund</button>
  </div>

  <h4 style="color: var(--primary); max-width:450px; margin:0 auto 15px auto; font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px;">📜 Your Withdrawal History</h4>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="withdrawalTableBody">
        <tr><td colspan="3" style="text-align:center; color:#64748b;">Syncing account financial ledger...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="modal-overlay" id="customAlertModal">
    <div class="alert-box">
      <div class="alert-icon" id="modalIcon">🎉</div>
      <div class="alert-title" id="modalTitle">Request Sent!</div>
      <div class="alert-msg" id="modalMessage">Your payout request registration completed successfully.</div>
      <button class="btn-alert-close" id="modalBtn" onclick="closeCustomAlert()">Okay, Done</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyCAV31XVQDKLgg8qKW1N5R9SmkwGrmsTgxZTV853LP2sSRZ2N9hTaq4YvuLp4lKjQe/exec";
    
    const loginUserId = (localStorage.getItem("currentUserId") || "").trim().toLowerCase();
    const loginUserName = localStorage.getItem("currentUserName") || "User";
    const loginUserMobile = localStorage.getItem("currentUserMobile") || "";

    function showCustomAlert(title, message, isSuccess) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerText = message;
      
      const iconEl = document.getElementById('modalIcon');
      const btnEl = document.getElementById('modalBtn');
      
      if (isSuccess) {
        iconEl.innerText = "🎉";
        btnEl.style.background = "var(--success)";
      } else {
        iconEl.innerText = "⚠️";
        btnEl.style.background = "#ef4444";
      }
      
      document.getElementById('customAlertModal').style.display = "flex";
    }

    function closeCustomAlert() {
      document.getElementById('customAlertModal').style.display = "none";
      loadWithdrawalHistory();
    }

    function loadWithdrawalHistory() {
      if(!loginUserId) {
        document.getElementById('withdrawalTableBody').innerHTML = "<tr><td colspan='3' style='text-align:center; color:#ef4444;'>Session Expired. Please Re-login.</td></tr>";
        return;
      }
      
      fetch(API_URL + `?action=getWithdrawHistory&userId=${loginUserId}`)
        .then(res => res.json())
        .then(res => {
          if(res && res.status === "success") {
            let html = "";
            let records = res.data || [];
            
            if(records.length > 0) {
              records.forEach(row => {
                let statusClass = "status-pending";
                let currentStatus = (row.status || "").trim().toLowerCase();
                
                if(currentStatus === "approved" || currentStatus === "success") {
                  statusClass = "status-approved";
                } else if(currentStatus === "failed" || currentStatus === "rejected") {
                  statusClass = "status-failed";
                }
                
                // 🎯 AUTOMATIC DYNAMIC DATE FORMATTER TO FORCELOCK DD-MM-YYYY
                let displayDate = "N/A";
                if (row.date) {
                  let dateStr = row.date.toString().trim();
                  
                  // Handles standard long GMT software text formatting logs
                  if (dateStr.includes("GMT") || (isNaN(dateStr) && dateStr.split(" ").length > 3)) {
                    let d = new Date(dateStr);
                    if (!isNaN(d.getTime())) {
                      let day = String(d.getDate()).padStart(2, '0');
                      let month = String(d.getMonth() + 1).padStart(2, '0');
                      let year = d.getFullYear();
                      displayDate = `${day}-${month}-${year}`;
                    } else {
                      displayDate = dateStr;
                    }
                  } else {
                    displayDate = dateStr;
                  }
                }
                
                html += `<tr>
                  <td>${displayDate}</td>
                  <td><strong>₹${row.amount || 0}</strong></td>
                  <td><span class="status-badge ${statusClass}">${row.status || 'Pending'}</span></td>
                </tr>`;
              });
              document.getElementById('withdrawalTableBody').innerHTML = html;
            } else {
              document.getElementById('withdrawalTableBody').innerHTML = "<tr><td colspan='3' style='text-align:center; color:#64748b;'>No withdrawal transactions found.</td></tr>";
            }
          } else {
            document.getElementById('withdrawalTableBody').innerHTML = "<tr><td colspan='3' style='text-align:center; color:#64748b;'>No withdrawal transactions found.</td></tr>";
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('withdrawalTableBody').innerHTML = "<tr><td colspan='3' style='text-align:center; color:#64748b;'>No withdrawal transactions found.</td></tr>";
        });
    }

    function submitWithdrawRequest() {
      const amountInput = document.getElementById('withdrawAmount');
      const amount = amountInput.value.trim();
      const btn = document.getElementById('btnSubmit');
      
      if(!amount || isNaN(amount) || Number(amount) <= 0) {
        showCustomAlert("Validation Error", "Please enter a valid amount greater than zero!", false);
        return;
      }
      
      btn.innerText = "Checking Balance...";
      btn.disabled = true;
      
      fetch(API_URL + `?action=getDashboard&userId=${loginUserId}`)
      .then(res => res.json())
      .then(dashRes => {
        let currentAvailable = 0;
        if(dashRes && dashRes.status === "success" && dashRes.data) {
          currentAvailable = Number(dashRes.data.availableBalance || dashRes.data.availablebalance || 0);
        }
        
        if(Number(amount) > currentAvailable) {
          btn.innerText = "Withdraw Fund";
          btn.disabled = false;
          showCustomAlert("Transaction Denied", `Insufficient Balance! Your available balance is ₹${currentAvailable}, but you requested ₹${amount}.`, false);
          return;
        }
        
        btn.innerText = "Processing Transact...";
        
        fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "withdraw",
            userId: loginUserId,
            name: loginUserName,
            mobile: loginUserMobile,
            amount: Number(amount)
          })
        })
        .then(res => res.json())
        .then(data => {
          btn.innerText = "Withdraw Fund";
          btn.disabled = false;
          
          if (data.status === "success") {
            showCustomAlert("Withdrawal Request Success", `Your payout transaction request of ₹${amount} has been submitted successfully for administrative confirmation!`, true);
            amountInput.value = "";
          } else {
            showCustomAlert("Transaction Denied", data.message || "Insufficient balance to process request.", false);
          }
        })
        .catch(err => {
          btn.innerText = "Withdraw Fund";
          btn.disabled = false;
          showCustomAlert("Server Error", "Unable to establish communication link with deployment server.", false);
        });
      })
      .catch(err => {
        btn.innerText = "Withdraw Fund";
        btn.disabled = false;
        showCustomAlert("Sync Error", "Failed to fetch live wallet authorization logs.", false);
      });
    }

    window.onload = loadWithdrawalHistory;
  </script>
</body>
</html>
