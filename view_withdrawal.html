<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cashgain - Withdrawal Center</title>
  <style>
    :root { 
      --primary: #1e293b; 
      --accent: #c2410c;
      --success: #16a34a; 
      --pending: #ea580c;
      --bg: #f8fafc; 
      --text: #334155; 
    }
    
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding: 15px; padding-bottom: 50px; box-sizing: border-box; }
    .withdraw-card { background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); margin-bottom: 25px; max-width: 450px; width: 100%; margin: 0 auto 25px auto; box-sizing: border-box; text-align: center; }
    h2 { color: var(--primary); margin-top: 0; font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .subtitle { color: #64748b; font-size: 13px; margin-bottom: 20px; line-height: 1.4; }
    
    .input-group { text-align: left; margin-bottom: 15px; max-width: 100%; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--primary); display: block; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; transition: border 0.2s; background: #f8fafc; }
    .input-group input:focus { border-color: var(--accent); outline: none; background: white; }
    
    .btn-action { width: 100%; padding: 14px 10px; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: var(--accent); box-shadow: 0 4px 12px rgba(194,65,12,0.2); transition: background 0.2s; margin-top: 10px; }
    .btn-action:hover { background: #9a3412; }
    
    /* Premium Mobile Fit Table Engine - Modified for No Scroll */
    .table-container { max-width: 450px; margin: 0 auto; margin-bottom: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); background: white; }
    table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; } /* Table layout fixed kiya taaki bahar na jaye */
    th, td { border-bottom: 1px solid #f1f5f9; padding: 12px 8px; text-align: left; font-size: 13px; word-wrap: break-word; white-space: normal; }
    
    /* Column widths allocated for automatic perfect mobile fitting */
    th:nth-child(1), td:nth-child(1) { width: 40%; } /* Date (DD-MM-YYYY) */
    th:nth-child(2), td:nth-child(2) { width: 30%; } /* Amount */
    th:nth-child(3), td:nth-child(3) { width: 30%; } /* Status */
    
    th { background: var(--primary); color: white; font-weight: 600; }
    
    .status-badge { font-weight: bold; padding: 4px 6px; border-radius: 6px; display: inline-block; font-size: 11px; text-align: center; width: 100%; box-sizing: border-box; }
    .status-pending { color: var(--pending); background: #fff7ed; }
    .status-approved { color: var(--success); background: #f0fdf4; }
    .status-failed { color: #ef4444; background: #fef2f2; }
  </style>
</head>
<body>

  <div class="withdraw-card">
    <h2>💸 Withdrawal Center</h2>
    <div class="subtitle">Submit a request to securely process funds directly from your account balance.</div>
    
    <div class="input-group">
      <label>Enter Amount (₹)</label>
      <input type="number" id="withdrawAmount" placeholder="Enter amount to withdraw" min="1">
    </div>
    
    <button class="btn-action" id="btnSubmit" onclick="submitWithdrawRequest()">Withdraw Fund</button>
  </div>

  <h4 style="color: var(--primary); max-width:450px; margin:0 auto 15px auto; font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px;">📜 Your Withdrawal History</h4>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="withdrawalTableBody">
        <tr><td colspan="3" style="text-align:center; color:#64748b;">Syncing account financial ledger...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzWyzaljyAVD-221dHdF2XBabfV3AFniSbhfTO2YvWHP09yc_-ro7kPCJ4HQQ0Zlk6V/exec";
    const loginUserId = (localStorage.getItem("currentUserId") || "").trim().toLowerCase();
    const loginUserName = localStorage.getItem("currentUserName") || "User";
    const loginUserMobile = localStorage.getItem("currentUserMobile") || "";

    // 100% Guaranteed Date conversion engine to DD-MM-YYYY format
    function formatCleanDate(rawDate) {
      if(!rawDate) return "N/A";
      try {
        let d = new Date(rawDate);
        // Agar dynamic parse na ho paye toh string format filters check karein
        if (isNaN(d.getTime())) {
          let dateStr = rawDate.toString();
          const months = { Jan:"01", Feb:"02", Mar:"03", Apr:"04", May:"05", Jun:"06", Jul:"07", Aug:"08", Sep:"09", Oct:"10", Nov:"11", Dec:"12" };
          let parts = dateStr.split(" ");
          
          if(parts.length >= 4 && months[parts[1]]) {
            return `${parts[2].padStart(2, '0')}-${months[parts[1]]}-${parts[3]}`;
          }
          if(dateStr.includes("-") && dateStr.length >= 10) {
            let cleanParts = dateStr.substring(0, 10).split("-");
            if(cleanParts.length === 3 && cleanParts[0].length === 4) {
              return `${cleanParts[2]}-${cleanParts[1]}-${cleanParts[0]}`; // YYYY-MM-DD to DD-MM-YYYY
            }
          }
          if(dateStr.includes("/") && dateStr.length >= 10) {
            let cleanParts = dateStr.substring(0, 10).split("/");
            if(cleanParts.length === 3 && cleanParts[2].length === 4) {
              return `${cleanParts[0].padStart(2, '0')}-${cleanParts[1].padStart(2, '0')}-${cleanParts[2]}`; // DD/MM/YYYY to DD-MM-YYYY
            }
          }
          return dateStr.substring(0, 10);
        }
        
        // Agar dynamic Javascript Date successfully parse ho gayi
        let day = String(d.getDate()).padStart(2, '0');
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let year = d.getFullYear();
        return `${day}-${month}-${year}`;
      } catch(e) {
        return rawDate.toString().substring(0, 10);
      }
    }

    function loadWithdrawalHistory() {
      if(!loginUserId) {
        document.getElementById('withdrawalTableBody').innerHTML = "<tr><td colspan='3' style='text-align:center; color:#ef4444;'>Session Expired. Please Re-login.</td></tr>";
        return;
      }
      
      fetch(API_URL + `?action=getWithdrawHistory&userId=${loginUserId}`)
        .then(res => res.json())
        .then(res => {
          if(res.status === "success") {
            let html = "";
            if(res.data && res.data.length > 0) {
              res.data.forEach(row => {
                let statusClass = "status-pending";
                let currentStatus = (row.status || "").trim().toLowerCase();
                
                if(currentStatus === "approved") {
                  statusClass = "status-approved";
                } else if(currentStatus === "failed" || currentStatus === "rejected") {
                  statusClass = "status-failed";
                }
                
                let displayDate = formatCleanDate(row.date); // Hardened formatting mechanism applied
                
                html += `<tr>
                  <td>${displayDate}</td>
                  <td><strong>₹${row.amount}</strong></td>
                  <td><span class="status-badge ${statusClass}">${row.status}</span></td>
                </tr>`;
              });
            }
            document.getElementById('withdrawalTableBody').innerHTML = html || "<tr><td colspan='3' style='text-align:center; color:#64748b;'>No withdrawal transactions found.</td></tr>";
          } else {
            document.getElementById('withdrawalTableBody').innerHTML = "<tr><td colspan='3' style='text-align:center; color:#64748b;'>No history logs tracked.</td></tr>";
          }
        })
        .catch(err => {
          document.getElementById('withdrawalTableBody').innerHTML = "<tr><td colspan='3' style='text-align:center; color:#64748b;'>Network sync active. Empty logs.</td></tr>";
        });
    }

    function submitWithdrawRequest() {
      const amountInput = document.getElementById('withdrawAmount');
      const amount = amountInput.value.trim();
      const btn = document.getElementById('btnSubmit');
      
      if(!amount || isNaN(amount) || Number(amount) <= 0) {
        alert("Please enter a valid amount!");
        return;
      }
      
      btn.innerText = "Processing Transact...";
      btn.disabled = true;
      
      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "withdraw",
          userId: loginUserId,
          name: loginUserName,
          mobile: loginUserMobile,
          amount: Number(amount)
        })
      })
      .then(() => {
        alert("Withdrawal request submitted successfully!");
        amountInput.value = "";
        btn.innerText = "Withdraw Fund";
        btn.disabled = false;
        setTimeout(loadWithdrawalHistory, 1500);
      })
      .catch(err => {
        alert("System error or network lag. Checking status...");
        btn.innerText = "Withdraw Fund";
        btn.disabled = false;
        setTimeout(loadWithdrawalHistory, 1500);
      });
    }

    window.onload = loadWithdrawalHistory;
  </script>
</body>
</html>
