<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashgain - Withdrawal Request</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f6f9; color: #333; padding: 15px; padding-bottom: 50px; box-sizing: border-box; }
    .form-group { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; max-width: 500px; margin-left: auto; margin-right: auto; box-sizing: border-box; }
    h2, h4 { margin-top: 0; color: #2c3e50; text-align: center; }
    
    label { font-weight: bold; font-size: 14px; color: #4f5d75; display: block; margin-top: 15px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    
    .btn-submit { width: 100%; padding: 14px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
    .btn-submit:hover { background: #c0392b; }
    
    /* History Table Layout with Date Column */
    .table-container { overflow-x: auto; max-width: 600px; margin: 0 auto; margin-bottom: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); background: white; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; background: white; min-width: 450px; }
    th, td { border: 1px solid #eee; padding: 12px; text-align: left; font-size: 14px; }
    th { background: #34495e; color: white; font-weight: 600; }
    .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; }
    .badge.Approved { background: #eafaf1; color: #27ae60; }
    .badge.Pending { background: #fef9e7; color: #f1c40f; }
    .badge.Rejected { background: #fdebd0; color: #e67e22; }
  </style>
</head>
<body>

  <h2>💸 Withdrawal Center</h2>
  
  <div class="form-group">
    <h4>New Withdrawal Request</h4>
    
    <label>Enter Amount (₹)</label>
    <input type="number" id="withAmount" placeholder="Enter amount to withdraw">
    
    <button class="btn-submit" onclick="submitWithdrawal()">Withdraw Fund</button>
  </div>

  <h4>📜 Your Withdrawal History</h4>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="withdrawTableBody">
        <tr><td colspan="3" style="text-align:center;">Syncing history...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbwqekmXtgBbJDlG1-VYCV8u2N5kvoCK0Bq7a0w7kKrZGaL1ITSAz_Xkgec1dj9UzH9f/exec"; 
    const userId = localStorage.getItem("currentUserId");

    function submitWithdrawal() {
      let amount = document.getElementById('withAmount').value;
      if(!amount || amount <= 0) return alert("Please enter a valid amount!");

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'withdraw', 
          userId: userId, 
          name: localStorage.getItem("currentUserName"), 
          mobile: localStorage.getItem("currentUserMobile"), 
          amount: amount 
        })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          alert("Withdrawal request submitted successfully!");
          document.getElementById('withAmount').value = "";
          loadHistory();
        } else {
          alert("Error: " + data.message);
        }
      });
    }

    function loadHistory() {
      fetch(API_URL + `?action=getWithdrawHistory&userId=${userId}`)
        .then(res => res.json())
        .then(data => {
          let html = "";
          if(data.status === "success") {
            data.history.forEach(row => {
              html += `<tr>
                <td>${row.date || '---'}</td>
                <td>₹${row.amount}</td>
                <td><span class="badge ${row.status}">${row.status}</span></td>
              </tr>`;
            });
            document.getElementById('withdrawTableBody').innerHTML = html || "<tr><td colspan='3' style='text-align:center;'>No history found.</td></tr>";
          }
        });
    }

    window.onload = function() {
      loadHistory();
    };
  </script>
</body>
</html>
